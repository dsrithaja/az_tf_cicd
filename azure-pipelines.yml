trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  terraformWorkingDirectory: terraform

stages:
- stage: TerraformCI
  displayName: Terraform CI

  jobs:
  - job: ValidateAndPlan
    displayName: Validate and Plan

    steps:
    - checkout: self

    - task: TerraformInstaller@1
      displayName: Install Terraform
      inputs:
        terraformVersion: 'latest'

    - task: AzureCLI@2
      displayName: Terraform Init, Format, Validate and Plan
      inputs:
        azureSubscription: 'adf-azure-service-connection'
        scriptType: pscore
        scriptLocation: inlineScript
        inlineScript: |
          Set-Location "$(System.DefaultWorkingDirectory)/$(terraformWorkingDirectory)"

          terraform init -input=false

          terraform fmt -check -recursive

          terraform validate

          terraform plan `
            -input=false `
            -var-file="env/dev.tfvars" `
            -out="$(Build.ArtifactStagingDirectory)/tfplan"
      env:
        TF_VAR_sql_administrator_login_password: $(TF_VAR_sql_administrator_login_password)

    - task: PublishPipelineArtifact@1
      displayName: Publish Terraform Plan
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)/tfplan'
        artifact: terraform-plan